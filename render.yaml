services:
  - type: web
    name: skillsync-backend
    runtime: node
    plan: free
    rootDir: .
    buildCommand: export DATABASE_URL="${DATABASE_URL}?sslmode=disable" && export DIRECT_URL="${DIRECT_URL}?sslmode=disable" && npm install && npx prisma generate --schema=backend/prisma/schema.prisma && npx prisma migrate deploy --schema=backend/prisma/schema.prisma
    startCommand: export DATABASE_URL="${DATABASE_URL}?sslmode=disable" && export DIRECT_URL="${DIRECT_URL}?sslmode=disable" && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: skillsync-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: skillsync-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

databases:
  - name: skillsync-db
    databaseName: skillsync
    plan: free

